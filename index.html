<!DOCTYPE html>
<html lang="pl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiMeet by Minerva — Nowoczesne wideokonferencje</title>
    <link rel="icon" type="image/svg+xml" href="https://dziennik-minerva.pages.dev/themes/icon-dark.svg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/livekit-client/dist/livekit-client.umd.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Open Sans"', 'sans-serif'],
                    },
                    colors: {
                        indigoBrand: '#1E2A78',
                        indigoDark: '#141D56',
                        amberBrand: '#F5A524',
                        amberLight: '#FFB946',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #F8FAFC;
            color: #1E293B;
            overflow-x: hidden;
        }
        .btn-center-fill {
            position: relative;
            overflow: hidden;
            z-index: 1;
            transition: color 0.35s cubic-bezier(0.25, 0.8, 0.25, 1), 
                        border-color 0.35s ease, 
                        transform 0.25s ease, 
                        box-shadow 0.35s ease;
        }
        .btn-center-fill::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.55s cubic-bezier(0.25, 0.8, 0.25, 1), 
                        height 0.55s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: -1;
        }
        .btn-center-fill:hover::before {
            width: 320%;
            height: 600%;
        }
        .btn-amber-to-indigo {
            background-color: #F5A524;
            color: #FFFFFF;
        }
        .btn-amber-to-indigo::before {
            background-color: #1E2A78;
        }
        .btn-amber-to-indigo:hover {
            color: #FFFFFF !important;
            box-shadow: 0 12px 28px -6px rgba(30, 42, 120, 0.4);
            transform: translateY(-2px);
        }
        .btn-indigo-to-amber {
            background-color: #1E2A78;
            color: #FFFFFF;
        }
        .btn-indigo-to-amber::before {
            background-color: #F5A524;
        }
        .btn-indigo-to-amber:hover {
            color: #1E2A78 !important;
            box-shadow: 0 12px 28px -6px rgba(245, 165, 36, 0.45);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="antialiased selection:bg-amberBrand selection:text-indigoBrand min-h-screen flex flex-col justify-between">

    <header class="sticky top-0 z-50 bg-[#080B1A]/95 backdrop-blur-md border-b border-white/10 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="#" class="flex items-center gap-3 group focus:outline-none">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amberBrand to-amber-600 flex items-center justify-center shadow-lg shadow-amberBrand/30 group-hover:scale-105 transition-transform duration-300">
                        <svg class="w-6 h-6 text-indigoDark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="23 7 16 12 23 17 23 7"></polygon>
                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                        </svg>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-white font-extrabold text-lg tracking-wider leading-none">MiMeet</span>
                        <span class="text-amberBrand text-[10px] font-bold tracking-widest uppercase mt-1">by Minerva</span>
                    </div>
                </a>
                <div class="flex items-center gap-3">
                    <span class="text-xs text-white/70 hidden sm:inline">Bezpieczne wideokonferencje zapewnia Minerva</span>
                    <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-3xl w-full space-y-8 bg-white p-6 sm:p-10 rounded-[28px] border-[3px] border-indigoBrand shadow-2xl relative overflow-hidden">
            <div class="absolute -top-16 -right-16 w-40 h-40 rounded-full bg-amberBrand/10 blur-2xl pointer-events-none"></div>

            <div id="joinView" class="space-y-6 max-w-xl mx-auto w-full">
                <div class="text-center space-y-2">
                    <span class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider bg-amberBrand/20 text-indigoBrand">
                        Panel Wideokonferencji
                    </span>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-indigoBrand tracking-tight">
                        Dołącz do spotkania <span class="text-amberBrand">MiMeet</span>
                    </h1>
                    <p class="text-slate-600 text-sm">
                        Wpisz nazwę pokoju, aby połączyć się z grupą.
                    </p>
                </div>

                <form id="joinForm" class="space-y-4">
                    <div>
                        <label for="roomName" class="block text-xs font-bold uppercase tracking-wider text-indigoBrand mb-1.5">Nazwa pokoju</label>
                        <input 
                            type="text" 
                            id="roomName" 
                            required 
                            placeholder="np. MiMeet" 
                            class="w-full px-4 py-3.5 rounded-xl border-2 border-slate-200 focus:border-indigoBrand focus:outline-none text-slate-800 font-medium transition-colors"
                        >
                    </div>

                    <div>
                        <label for="userName" class="block text-xs font-bold uppercase tracking-wider text-indigoBrand mb-1.5">Twoje imię i nazwisko</label>
                        <input 
                            type="text" 
                            id="userName" 
                            required 
                            placeholder="np. Jan Kowalski" 
                            class="w-full px-4 py-3.5 rounded-xl border-2 border-slate-200 focus:border-indigoBrand focus:outline-none text-slate-800 font-medium transition-colors"
                        >
                    </div>

                    <button 
                        type="submit" 
                        class="btn-center-fill btn-indigo-to-amber w-full font-bold text-base py-4 rounded-xl shadow-lg cursor-pointer">
                        Wejdź do pokoju
                    </button>
                </form>
            </div>

            <div id="roomView" class="hidden space-y-6">
                <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                    <div>
                        <h2 id="activeRoomTitle" class="text-lg font-extrabold text-indigoBrand">Pokój</h2>
                        <p class="text-xs text-slate-500">Zalogowany jako: <span id="activeUserName" class="font-semibold text-indigoBrand"></span></p>
                    </div>
                    <span class="px-3 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> Połączono z MiMeet
                    </span>
                </div>

                <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 bg-slate-900 p-3 rounded-2xl min-h-[380px] max-h-[500px] overflow-y-auto items-center justify-center relative"></div>

                <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
                    <button type="button" onclick="toggleMute()" id="muteBtn" class="px-4 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-indigoBrand font-bold text-sm transition-colors cursor-pointer flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
                        Mute / Unmute
                    </button>
                    <button type="button" onclick="toggleVideo()" id="videoBtn" class="px-4 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-indigoBrand font-bold text-sm transition-colors cursor-pointer flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                        Kamera On/Off
                    </button>
                    <button type="button" onclick="leaveRoom()" class="px-6 py-3 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-sm transition-colors cursor-pointer shadow-md">
                        Opuść spotkanie
                    </button>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-[#050711] text-white py-6 px-4 sm:px-6 lg:px-8 border-t border-white/10 text-center">
        <p class="text-xs sm:text-sm text-white/70 font-normal">
            &copy; 2026 Minerva. Wszelkie prawa zastrzeżone.
        </p>
    </footer>

    <script>
        const LIVEKIT_URL = 'wss://mimeet-minerva-ngcedz2f.livekit.cloud';

        let room = null;
        let currentAudioMuted = false;
        let currentVideoOff = false;

        const joinForm = document.getElementById('joinForm');
        const joinView = document.getElementById('joinView');
        const roomView = document.getElementById('roomView');
        const activeRoomTitle = document.getElementById('activeRoomTitle');
        const activeUserName = document.getElementById('activeUserName');
        const videoGrid = document.getElementById('videoGrid');

        joinForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const roomName = document.getElementById('roomName').value.trim();
            const userName = document.getElementById('userName').value.trim();

            if (!roomName || !userName) return;

            try {
                activeRoomTitle.textContent = 'Pokój: ' + roomName;
                activeUserName.textContent = userName;

const response = await fetch(`https://mimeet-api.o5k4r-solutions.workers.dev/api/token?room=${encodeURIComponent(roomName)}&username=${encodeURIComponent(userName)}`);
                if (!response.ok) throw new Error('Nie udało się pobrać tokenu autoryzacyjnego');
                const data = await response.json();
                const token = data.token;

                room = new LiveKitClient.Room({
                    adaptiveStream: true,
                    dynacast: true,
                });

                room.on(LiveKitClient.RoomEvent.TrackSubscribed, handleTrackSubscribed);
                room.on(LiveKitClient.RoomEvent.TrackUnsubscribed, handleTrackUnsubscribed);
                room.on(LiveKitClient.RoomEvent.Disconnected, () => {
                    leaveRoom();
                });

                await room.connect(LIVEKIT_URL, token);
                await room.localParticipant.enableCameraAndMicrophone();

                handleLocalParticipant(room.localParticipant);

                joinView.classList.add('hidden');
                roomView.classList.remove('hidden');

            } catch (error) {
                alert("Błąd połączenia z serwerem wideo. Sprawdź konfigurację.");
                console.error(error);
            }
        });

        function handleLocalParticipant(participant) {
            const wrapper = document.createElement('div');
            wrapper.id = `participant-${participant.identity}`;
            wrapper.className = "relative bg-slate-800 rounded-xl overflow-hidden aspect-video flex items-center justify-center border border-slate-700 shadow-md";
            
            participant.videoTracks.forEach(publication => {
                if (publication.track) {
                    const element = publication.track.attach();
                    element.className = "w-full h-full object-cover";
                    wrapper.appendChild(element);
                }
            });

            const label = document.createElement('div');
            label.className = "absolute bottom-2 left-2 bg-black/60 text-white text-xs px-2 py-1 rounded backdrop-blur-sm";
            label.textContent = "Ty (" + participant.name + ")";
            wrapper.appendChild(label);

            videoGrid.appendChild(wrapper);
        }

        function handleTrackSubscribed(track, publication, participant) {
            if (track.kind === 'video' || track.kind === 'audio') {
                let wrapper = document.getElementById(`participant-${participant.identity}`);
                if (!wrapper) {
                    wrapper = document.createElement('div');
                    wrapper.id = `participant-${participant.identity}`;
                    wrapper.className = "relative bg-slate-800 rounded-xl overflow-hidden aspect-video flex items-center justify-center border border-slate-700 shadow-md";
                    videoGrid.appendChild(wrapper);
                }

                const element = track.attach();
                if (track.kind === 'video') {
                    element.className = "w-full h-full object-cover";
                    wrapper.appendChild(element);
                    
                    const label = document.createElement('div');
                    label.className = "absolute bottom-2 left-2 bg-black/60 text-white text-xs px-2 py-1 rounded backdrop-blur-sm";
                    label.textContent = participant.name || "Uczestnik";
                    wrapper.appendChild(label);
                }
            }
        }

        function handleTrackUnsubscribed(track) {
            track.detach().forEach(element => element.remove());
        }

        async function toggleMute() {
            if (!room) return;
            currentAudioMuted = !currentAudioMuted;
            await room.localParticipant.setMicrophoneEnabled(!currentAudioMuted);
            const btn = document.getElementById('muteBtn');
            btn.classList.toggle('bg-rose-100', currentAudioMuted);
            btn.classList.toggle('text-rose-600', currentAudioMuted);
        }

        async function toggleVideo() {
            if (!room) return;
            currentVideoOff = !currentVideoOff;
            await room.localParticipant.setCameraEnabled(!currentVideoOff);
            const btn = document.getElementById('videoBtn');
            btn.classList.toggle('bg-rose-100', currentVideoOff);
            btn.classList.toggle('text-rose-600', currentVideoOff);
        }

        function leaveRoom() {
            if (room) {
                room.disconnect();
                room = null;
            }
            videoGrid.innerHTML = '';
            roomView.classList.add('hidden');
            joinView.classList.remove('hidden');
            document.getElementById('roomName').value = '';
        }
    </script>
</body>
</html>
